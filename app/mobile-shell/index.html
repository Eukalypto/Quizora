<!doctype html>
<!--
  Capacitor's required local webDir root. Not the real app — Quizora is a
  full SSR app (Clerk auth + D1 data need the live Worker), so
  capacitor.config.ts points server.url at the deployed app directly. This
  page only ever shows if that load hasn't happened yet (e.g. briefly on
  cold start) or if the device has no network connectivity.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quizora</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #0a0a0a;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      p { padding: 0 2rem; opacity: 0.7; }
    </style>
  </head>
  <body>
    <p>Connecting to Quizora&hellip;</p>
  </body>
</html>
